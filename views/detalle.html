<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CinePleX - Detalle de Película</title>
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/navbar.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <style>
    /* ==========================================
       ESTILOS: DETALLE DE PELÍCULA & HORARIOS
       ========================================== */
    .movie-detail-main {
      max-width: 1280px;
      margin: 2.5rem auto 5rem auto;
      padding: 0 2rem;
    }

    .movie-top-section {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 3.5rem;
      align-items: start;
      margin-bottom: 3.5rem;
    }

    /* Columna Izquierda: Póster con etiquetas */
    .poster-card-wrapper {
      position: relative;
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid var(--border-color);
      box-shadow: 0 20px 40px var(--shadow-color);
      background-color: var(--bg-card);
    }

    .poster-img-el {
      width: 100%;
      height: 520px;
      object-fit: cover;
      display: block;
    }

    .poster-top-bar {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 2;
    }

    .poster-tag {
      background: rgba(13, 8, 20, 0.85);
      color: #ffffff;
      padding: 0.3rem 0.65rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 800;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,0.15);
    }

    .poster-actors-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(0deg, rgba(13, 8, 20, 0.95) 0%, rgba(13, 8, 20, 0.6) 70%, transparent 100%);
      padding: 1.5rem 1rem 0.8rem 1rem;
      display: flex;
      justify-content: space-around;
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 600;
    }

    /* Columna Derecha: Horarios y Selectores */
    .schedule-panel {
      display: flex;
      flex-direction: column;
    }

    .movie-title-header {
      margin-bottom: 1.5rem;
    }

    .movie-title-header h1 {
      font-size: 2.8rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      color: var(--text-white);
      line-height: 1.1;
      margin: 0;
    }

    .movie-title-header .movie-genres-row {
      margin-top: 0.5rem;
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .movie-genre-badge {
      background: rgba(109, 40, 217, 0.2);
      border: 1px solid rgba(139, 92, 246, 0.35);
      color: #c4b5fd;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 0.25rem 0.65rem;
      border-radius: 6px;
    }

    .horarios-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.8rem;
      margin-bottom: 1.5rem;
      margin-top: 1rem;
    }

    .horarios-title-row h3 {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text-white);
      margin: 0;
    }

    .link-cartelera-cine {
      color: #a78bfa;
      font-size: 0.82rem;
      font-weight: 700;
      text-decoration: none;
      transition: color 0.2s;
    }

    .link-cartelera-cine:hover {
      color: #ffffff;
      text-decoration: underline;
    }

    /* Slider de Días */
    .days-slider-container {
      display: flex;
      gap: 0.8rem;
      overflow-x: auto;
      padding-bottom: 0.8rem;
      margin-bottom: 1.8rem;
    }

    .day-btn {
      flex: 1;
      min-width: 76px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 0.75rem 0.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.2s ease;
    }

    .day-btn span {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 0.2rem;
    }

    .day-btn strong {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--text-white);
    }

    .day-btn:hover {
      border-color: #8b5cf6;
      background-color: rgba(109, 40, 217, 0.12);
    }

    .day-btn.active {
      border-color: #8b5cf6;
      background: linear-gradient(135deg, rgba(109, 40, 217, 0.3) 0%, rgba(30, 16, 53, 0.8) 100%);
      box-shadow: 0 0 16px rgba(139, 92, 246, 0.35);
    }

    .day-btn.active strong {
      color: #ffffff;
    }

    /* Barra de Acción: Filtros y Botón de Compra */
    .schedule-action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1.5rem;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 1.25rem 1.75rem;
      margin-bottom: 2rem;
    }

    .filters-group {
      display: flex;
      gap: 1rem;
    }

    .filter-select-box {
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-white);
      padding: 0.6rem 1.2rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s;
    }

    .filter-select-box:hover {
      border-color: var(--primary-purple);
    }

    .btn-buy-ticket-action {
      background: linear-gradient(135deg, #6d28d9 0%, #5b21b6 100%);
      color: #ffffff;
      border: none;
      border-radius: 9999px;
      padding: 0.85rem 2.2rem;
      font-size: 0.92rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(109, 40, 217, 0.45);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-buy-ticket-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(109, 40, 217, 0.6);
      background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
    }

    /* Leyenda de Disponibilidad */
    .seats-legend-box {
      border-top: 1px solid var(--border-color);
      padding-top: 1.25rem;
    }

    .seats-legend-box h4 {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 0.8rem;
    }

    .seats-status-row {
      display: flex;
      gap: 1.8rem;
      flex-wrap: wrap;
    }

    .seat-status-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.82rem;
      color: var(--text-white);
    }

    .seat-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .seat-dot.alta { background-color: #22c55e; }
    .seat-dot.media { background-color: #eab308; }
    .seat-dot.baja { background-color: #ef4444; }
    .seat-dot.completa { background-color: #64748b; }

    /* SECCIÓN INFERIOR: SINOPSIS Y TRAILER OFICIAL */
    .movie-bottom-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3rem;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 2.5rem;
    }

    .info-block h3 {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      color: var(--text-white);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .info-block h3 span {
      display: inline-block;
      width: 4px;
      height: 18px;
      background: var(--primary-purple);
      border-radius: 2px;
    }

    .info-block p {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.75;
    }

    .trailer-player-box {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      height: 0;
      border-radius: 12px;
      overflow: hidden;
      background: #000000;
      border: 1px solid rgba(139, 92, 246, 0.35);
      box-shadow: 0 12px 36px rgba(0,0,0,0.7);
    }

    .trailer-player-box iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    @media (max-width: 950px) {
      .movie-top-section, .movie-bottom-content {
        grid-template-columns: 1fr;
      }
      .poster-img-el {
        height: 420px;
        max-width: 320px;
        margin: 0 auto;
      }
      .movie-title-header h1 {
        font-size: 2.2rem;
      }
      .schedule-action-bar {
        flex-direction: column;
        align-items: stretch;
      }
      .btn-buy-ticket-action {
        width: 100%;
        text-align: center;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <!-- APPBAR INYECTADO POR LAYOUT.JS -->
  <div id="app-navbar"></div>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="movie-detail-main">

    <!-- SECCIÓN SUPERIOR: PÓSTER Y HORARIOS -->
    <div class="movie-top-section">
      
      <!-- LADO IZQUIERDO: PÓSTER -->
      <div class="poster-card-wrapper">
        <div class="poster-top-bar">
          <span class="poster-tag" id="pDuracion">2h 46m</span>
          <span class="poster-tag" id="pIdiomaBadge">SUB</span>
        </div>
        <img id="pPoster" src="" alt="Póster" class="poster-img-el">
        <div class="poster-actors-bar">
          <span id="pActor1">Actor 1</span>
          <span id="pActor2">Actor 2</span>
        </div>
      </div>

      <!-- LADO DERECHO: HORARIOS -->
      <div class="schedule-panel">
        <div class="movie-title-header">
          <h1 id="pTitulo">Cargando...</h1>
          <div class="movie-genres-row">
            <span class="movie-genre-badge" id="pGenero">Ciencia Ficción • IMAX / 4D</span>
            <span class="poster-tag" id="pRating">+13</span>
          </div>
        </div>

        <div class="horarios-title-row">
          <h3>Horarios y Funciones</h3>
          <a href="home.html#cartelera" class="link-cartelera-cine">Ver toda la cartelera &gt;</a>
        </div>

        <!-- SELECTOR DE DÍAS -->
        <div class="days-slider-container">
          <button class="day-btn active">
            <span>Jue</span>
            <strong>29/OCT</strong>
          </button>
          <button class="day-btn">
            <span>Vie</span>
            <strong>30/OCT</strong>
          </button>
          <button class="day-btn">
            <span>Sáb</span>
            <strong>31/OCT</strong>
          </button>
          <button class="day-btn">
            <span>Dom</span>
            <strong>1/NOV</strong>
          </button>
          <button class="day-btn">
            <span>Lun</span>
            <strong>2/NOV</strong>
          </button>
        </div>

        <!-- FILTROS Y BOTÓN DE COMPRA -->
        <div class="schedule-action-bar">
          <div class="filters-group">
            <select class="filter-select-box">
              <option>Formatos: Todos</option>
              <option>2D Estándar</option>
              <option>VIP Reclinable</option>
              <option>4D E-Motion</option>
            </select>
            <select class="filter-select-box">
              <option>Idioma: Subtitulada</option>
              <option>Idioma: Doblada Español</option>
            </select>
          </div>

          <button type="button" class="btn-buy-ticket-action" onclick="handleComprarTicket()">
            <span class="material-symbols-outlined" style="font-size: 20px;">local_activity</span>
            Comprar Entradas
          </button>
        </div>

        <!-- LEYENDA DE DISPONIBILIDAD -->
        <div class="seats-legend-box">
          <h4>Disponibilidad de Butacas</h4>
          <div class="seats-status-row">
            <div class="seat-status-item"><span class="seat-dot alta"></span> Alta</div>
            <div class="seat-status-item"><span class="seat-dot media"></span> Media</div>
            <div class="seat-status-item"><span class="seat-dot baja"></span> Baja</div>
            <div class="seat-status-item"><span class="seat-dot completa"></span> Completa</div>
          </div>
        </div>

      </div>

    </div>

    <!-- SECCIÓN INFERIOR: SINOPSIS Y TRAILER OFICIAL -->
    <div class="movie-bottom-content">
      
      <div class="info-block">
        <h3><span></span> Sinopsis</h3>
        <p id="pSinopsis">Cargando descripción de la película...</p>
      </div>

      <div class="info-block">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem;">
          <h3 style="margin-bottom: 0;"><span></span> Tráiler Oficial</h3>
          <span style="font-size: 0.72rem; font-weight: 800; color: #a78bfa; background: rgba(139, 92, 246, 0.15); border: 1px solid rgba(139, 92, 246, 0.3); padding: 3px 8px; border-radius: 9999px; text-transform: uppercase; letter-spacing: 0.05em;">HD 1080p</span>
        </div>
        <div class="trailer-player-box">
          <iframe id="pVideoIframe" 
                  src="" 
                  title="Tráiler Oficial CinePleX" 
                  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                  allowfullscreen>
          </iframe>
        </div>
      </div>

    </div>

  </main>

  <!-- SCRIPT DINÁMICO CON TRAILERS OFICIALES DE TODAS LAS PELÍCULAS -->
  <script>

      "dune-2": {

        youtubeId: "Way9Dexny3w"
      },

      },
      "oppenheimer": {
        id: "oppenheimer",
        titulo: "Oppenheimer",
        duracion: "3h 00m",
        idioma: "SUB",
        genero: "Drama / Historia • IMAX / 2D",
        rating: "+16",
        actor1: "Cillian Murphy",
        actor2: "Emily Blunt",
        sinopsis: "Película biográfica épica dirigida por Christopher Nolan sobre el físico teórico J. Robert Oppenheimer, director del Laboratorio de Los Álamos y el proyecto Manhattan, cuyo invento cambió el curso de la historia humana para siempre.",

        youtubeId: "uYPbbksJxIg"
      },
      "deadpool": {
        id: "deadpool",

        duracion: "2h 08m",
        idioma: "SUB",
        genero: "Acción / Comedia • 2D / 4D",
        rating: "+18",
        actor1: "Ryan Reynolds",
        actor2: "Hugh Jackman",
        sinopsis: "Un apático Wade Wilson se afana en la vida civil. Sus días como el mercenario moralmente flexible Deadpool han quedado atrás. Cuando su mundo natal se enfrenta a una amenaza existencial, Wade se ve obligado a convencer a un reacio Wolverine para salvar su universo.",

        youtubeId: "73_1biulkYk"
      },
      "siniestra": {
        id: "siniestra",
        titulo: "Temporada Siniestra",
        duracion: "1h 52m",
        idioma: "ESP",
        genero: "Terror / Suspenso • VIP 4D",
        rating: "+18",
        actor1: "Mia Goth",
        actor2: "Bill Skarsgård",
        sinopsis: "Una aterradora experiencia sobrenatural en una aislada comunidad rural durante el festival de otoño. Los habitantes comienzan a desaparecer misteriosamente tras el anochecer, revelando un oscuro culto ancestral.",

        youtubeId: "x0c_5YkKjZk"
      },
      "joker-2": {
        id: "joker-2",
        titulo: "Joker: Folie à Deux",
        duracion: "2h 18m",
        idioma: "SUB",
        genero: "Drama / Crimen • Preventa VIP",
        rating: "+16",
        actor1: "Joaquin Phoenix",
        actor2: "Lady Gaga",
        sinopsis: "Arthur Fleck institucionalizado en Arkham esperando juicio por sus crímenes como Joker conoce al amor de su vida, Harley Quinn, descubriendo la locura y la música que siempre estuvieron dentro de él.",

        youtubeId: "_OKAwz2NiJs"
      },
      "gladiador-2": {
        id: "gladiador-2",
        titulo: "Gladiador II",
        duracion: "2h 28m",
        idioma: "SUB",
        genero: "Acción / Épica • Preventa IMAX",
        rating: "+16",
        actor1: "Paul Mescal",
        actor2: "Pedro Pascal",
        sinopsis: "Años después de presenciar la muerte del venerado héroe Máximo, Lucio debe ingresar al Coliseo después de que su hogar sea conquistado por los tiránicos emperadores que ahora lideran Roma con puño de hierro.",

      },
      "venom-3": {
        id: "venom-3",
        titulo: "Venom: El Último Baile",
        duracion: "1h 50m",
        idioma: "ESP",
        genero: "Acción / Sci-Fi • Preventa 3D",
        rating: "+13",
        actor1: "Tom Hardy",
        actor2: "Chiwetel Ejiofor",
        sinopsis: "Eddie y Venom están huyendo. Cazados por los mundos de ambos y con la red cerrándose inexorablemente, el dúo se ve obligado a tomar una decisión devastadora que bajará el telón de su último baile juntos.",
        poster: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=800&q=80",
        youtubeId: "__2bjWbetsA"
      },
      "rohirrim": {
        id: "rohirrim",
        titulo: "El Señor de los Anillos: La Guerra de los Rohirrim",
        duracion: "2h 15m",
        idioma: "SUB",
        genero: "Animación / Fantasía",
        rating: "+13",
        actor1: "Brian Cox",
        actor2: "Gaia Wise",
        sinopsis: "La historia no contada detrás del Abismo de Helm, cientos de años antes de la fatídica guerra, contando la vida y los tiempos empapados de sangre de su fundador, Helm Hammerhand.",

        youtubeId: "gSZ_M1k2b6M"
      }
    };

    const urlParams = new URLSearchParams(window.location.search);
    const idPelicula = urlParams.get('pelicula') || 'dune-2';
    const pelicula = peliculasDB[idPelicula] || peliculasDB['dune-2'];

    document.getElementById('pTitulo').innerText = pelicula.titulo;
    document.getElementById('pDuracion').innerText = pelicula.duracion;
    document.getElementById('pIdiomaBadge').innerText = pelicula.idioma;
    document.getElementById('pActor1').innerText = pelicula.actor1;
    document.getElementById('pActor2').innerText = pelicula.actor2;
    document.getElementById('pSinopsis').innerText = pelicula.sinopsis;
    document.getElementById('pPoster').src = pelicula.poster;
    if (document.getElementById('pGenero')) document.getElementById('pGenero').innerText = pelicula.genero;
    if (document.getElementById('pRating')) document.getElementById('pRating').innerText = pelicula.rating;
    
    // Inyectar el reproductor oficial del tráiler de YouTube en HD
    const iframeEl = document.getElementById('pVideoIframe');
    if (iframeEl && pelicula.youtubeId) {
      iframeEl.src = `https://www.youtube-nocookie.com/embed/${pelicula.youtubeId}?rel=0&modestbranding=1&enablejsapi=1`;
    }
    document.title = `CinePleX - ${pelicula.titulo} (Tráiler Oficial)`;

    // Función del botón Comprar Entradas
    function handleComprarTicket() {
      window.location.href = "comprar-ticket.html?pelicula=" + (pelicula.id || idPelicula);
    }
  </script>

  <script src="../assets/js/layout.js"></script>
</body>
</html>
